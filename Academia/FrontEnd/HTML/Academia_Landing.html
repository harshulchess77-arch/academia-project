<!-- We declare the document type using DOCTYPE so the web browser knows to render this file as an HTML5 document -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- We use the title tag to show the main project name and description on the browser tab -->
    <title>Academia - Unified School Management System</title>
    <!-- We link our external CSS stylesheet using href so this page inherits our global design rules -->
    <link rel="stylesheet" href="../CSS/Academia.css">
</head>
<body>
    <!-- We create a header div container to display our primary brand identity and quick navigation options -->
    <div class="header">
        <h2>Academia</h2>
        <!-- We use an anchor tag with an href link so visitors can easily navigate to the secure authentication page -->
        <a href="Academia_Auth.html">Sign In</a>
    </div>
    <!-- We create a main container div with custom styling to center the welcome message and call-to-action buttons -->
    <div class="container" style="text-align: center; padding: 60px 20px;">
        <!-- We use an h1 tag to present the main welcome headline of the unified ecosystem -->
        <h1>Welcome to Academia</h1>
        <!-- We use a paragraph tag to explain the core mission statement and purpose of the web application -->
        <p style="font-size: 1.2rem; color: #555;">Education Today. A Brighter Tomorrow. Unified Portals for Students, Parents, and Staff.</p>
        <br>
        <!-- We use an anchor tag styled as a prominent button to encourage users to click and access the login portal -->
        <a href="Academia_Auth.html" style="background-color: #0b3d91; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block;">Get Started</a>
    </div>
    <!-- We create a footer div container at the bottom of the page to display our institutional motto -->
    <div class="footer">EDUCATION TODAY. A BRIGHTER TOMORROW.</div>

</body>
</html>
