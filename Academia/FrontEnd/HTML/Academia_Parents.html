<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines the document language and character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the browser tab title -->
    <title>Academia - Parent Portal</title>

    <!-- Connects the external stylesheet -->
    <link rel="stylesheet" href="../Academia.css">

    <!-- Connects the Parent JavaScript file -->
    <script src="Parent.js" defer></script>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <b>Academia Parent Portal</b>

        <a href="../Academia Authorization/Academia_Auth.html">
            Log Out
        </a>
    </div>

    <!-- Error Message Display -->
    <p id="error" style="color: red; text-align: center;"></p>

    <!-- Parent Profile -->
    <div class="blue-box">

        <h2 id="welcome">Welcome, Parent!</h2>

        <p>
            Username:
            <span id="parentUsername">Loading...</span>
        </p>

        <p>
            Phone:
            <span id="parentPhone">Loading...</span>
        </p>

    </div>

    <!-- Student Information -->
    <div class="box">

        <h2>Student Information</h2>

        <p>
            Name:
            <span id="studentName">Loading...</span>
        </p>

        <p>
            Grade Level:
            <span id="gradeLevel">Loading...</span>
        </p>

        <p>
            GPA:
            <span id="studentGpa">Loading...</span>
        </p>

    </div>

    <!-- Student Grades -->
    <div class="box">

        <h2>Grades</h2>

        <table>

            <thead>
                <tr>
                    <th>Course</th>
                    <th>Score</th>
                </tr>
            </thead>

            <tbody id="gradeList">
            </tbody>

        </table>

    </div>

    <!-- Student Attendance -->
    <div class="box">

        <h2>Attendance</h2>

        <table>

            <thead>
                <tr>
                    <th>Course</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="attendanceList">
            </tbody>

        </table>

    </div>

    <!-- School Announcements -->
    <div class="box">

        <h2>Announcements</h2>

        <div id="announcementList">
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        Academia Parent Portal
    </div>

</body>

</html>
