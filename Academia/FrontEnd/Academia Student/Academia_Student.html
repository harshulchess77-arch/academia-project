<!DOCTYPE html>
<html>
<head>
    <title>Academia - Student Portal</title>
    <link rel="stylesheet" href="../Academia.css">
</head>
<body>
    <div class="navbar">
        <h2>Academia | Student Portal</h2>
        <div>
            <span id="student-label" style="margin-right: 15px;"></span>
            <a href="../Academia Authrization/Academia_Auth.html">Logout</a>
        </div>
    </div>

    <div class="main-box">
        <div class="top-cards">
            <div class="card">
                <h3>My GPA</h3>
                <p id="gpa-text">0.00</p>
            </div>
            <div class="card">
                <h3>Average Grade</h3>
                <p id="avg-text">0%</p>
            </div>
            <div class="card">
                <h3>Attendance</h3>
                <p id="att-text">0%</p>
            </div>
        </div>

        <div class="panel">
            <h3>My Grades</h3>
            <table>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="grades-list"></tbody>
            </table>
        </div>

        <div class="panel">
            <h3>My Attendance</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="att-list"></tbody>
            </table>
        </div>

        <div class="panel">
            <h3>School Announcements</h3>
            <div id="ann-list"></div>
        </div>
    </div>

    <div class="footer">EDUCATION TODAY. A BRIGHTER TOMORROW.</div>

    <script src="../Academia.js"></script>
    <script>
        var user = JSON.parse(localStorage.getItem("currentUser")) || { username: "student1", studentId: "STU01" };
        document.getElementById("student-label").innerText = user.username + " (" + user.studentId + ")";

        var grades = JSON.parse(localStorage.getItem("grades"));
        var attendance = JSON.parse(localStorage.getItem("attendance"));
        var announcements = JSON.parse(localStorage.getItem("announcements"));

        var totalScore = 0;
        var gradeCount = 0;
        var gradesHtml = "";

        for (var i = 0; i < grades.length; i++) {
            if (grades[i].studentId === user.studentId) {
                gradesHtml += "<tr><td>" + grades[i].course + "</td><td>" + grades[i].score + "%</td></tr>";
                totalScore += Number(grades[i].score);
                gradeCount++;
            }
        }
        document.getElementById("grades-list").innerHTML = gradesHtml;

        if (gradeCount > 0) {
            var avg = totalScore / gradeCount;
            var gpa = (avg / 100) * 4.0;
            document.getElementById("avg-text").innerText = avg.toFixed(1) + "%";
            document.getElementById("gpa-text").innerText = gpa.toFixed(2);
        }

        var presentCount = 0;
        var totalDays = 0;
        var attHtml = "";

        for (var j = 0; j < attendance.length; j++) {
            if (attendance[j].studentId === user.studentId) {
                attHtml += "<tr><td>" + attendance[j].date + "</td><td>" + attendance[j].status + "</td></tr>";
                totalDays++;
                if (attendance[j].status === "Present") {
                    presentCount++;
                }
            }
        }
        document.getElementById("att-list").innerHTML = attHtml;

        if (totalDays > 0) {
            var rate = (presentCount / totalDays) * 100;
            document.getElementById("att-text").innerText = rate.toFixed(0) + "%";
        }

        var annHtml = "";
        for (var k = 0; k < announcements.length; k++) {
            annHtml += "<div class='notice'><b>" + announcements[k].date + ":</b> " + announcements[k].message + "</div>";
        }
        document.getElementById("ann-list").innerHTML = annHtml;
    </script>
</body>
</html>
