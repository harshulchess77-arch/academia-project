<!DOCTYPE html>
<html>
<head>
    <title>Academia - Login</title>
    <link rel="stylesheet" href="../Academia.css">
</head>
<body>

    <div class="left-half">
        <h1>Academia</h1>
        <h2>One System.<br>A Stronger School Community.</h2>
        <p style="color: #60A5FA;">Students. Parents. Staff. All Connected.</p>
        <img id="slide" src="../../Images/AuthPage1.png" width="380" alt="Slide Image">
    </div>

    <div class="right-half">
        <div class="box" style="width: 300px;">
            <h2>Login / Sign Up</h2>
            <p>Username:</p>
            <input type="text" id="user">

            <p>Password:</p>
            <input type="password" id="pass">

            <p>Select Role:</p>
            <select id="role">
                <option value="student">Student</option>
                <option value="parent">Parent</option>
                <option value="staff">School Staff</option>
            </select>
            <br><br>

            <button class="btn" onclick="loginUser()">Submit</button>
            <p id="msg" style="color: red;"></p>
            <br>
            <a href="../Academia Landing/Academia_Landing.html">Back to Landing Page</a>
        </div>
    </div>

    <script>
        // Put your 4 image names from Academia/Images/ here:
        var pics = [
            "../../Images/AuthPage1.png",
            "../../Images/AuthPage2.png",
            "../../Images/AuthPage3.png",
            "../../Images/AuthPage4.png"
        ];
        var num = 0;

        function nextPic() {
            num = num + 1;
            if (num == 4) {
                num = 0;
            }
            document.getElementById("slide").src = pics[num];
        }

        setInterval(nextPic, 5000);

        function loginUser() {
            var u = document.getElementById("user").value;
            var p = document.getElementById("pass").value;
            var r = document.getElementById("role").value;

            if (u == "" || p == "") {
                document.getElementById("msg").innerHTML = "Please enter username and password.";
                return;
            }

            if (r == "student") {
                window.location.href = "../Academia Student/Academia_Student.html";
            } else if (r == "parent") {
                window.location.href = "../Academia Parents/Academia_Parents.html";
            } else if (r == "staff") {
                window.location.href = "../Academia School Staff/Academia_School_Staff.html";
            }
        }
    </script>

</body>
</html>
