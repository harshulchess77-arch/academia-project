<!DOCTYPE html>
<html>
<head>
    <!-- Creates Title and connects StyleSheet-->
     <!-- main header for the login page -->
    <title>Academia - Login</title>
    <link rel="stylesheet" href="../Academia.css">
</head>

<body>
    <!--connect to the js file-->
    <script src="Academia.js"></script>

    <!-- left side of the Auth Screen. Creates title and slide show of images-->
    <div class="left-side">

        <h1>Academia</h1>
        <h2>One System.<br>A Stronger School Community.</h2>

        <!-- change color for the text, and load image from the imges folder -->
        <p style="color: #60A5FA;">Students. Parents. Staff. All Connected.</p>
        <img id="slide-pic" src="../../Images/AuthPage1.png" width="360" alt="Academia Slide">
    </div>

    <!-- Rigth side of the Auth Screen and Creates the SignIn/SignUp menu.-->
    <div class="right-side">
        <!-- set the width of the box -->
        <div class="box" style="width: 300px;">
            <!-- Sign In / Sign Up text -->
            <h2>Sign In / Sign Up</h2>

            <!-- create typing box for username-->
            <p>Username:</p>
            <input type="text" id="username">

            <!-- create typing box for password-->
            <p>Password:</p>
            <input type="password" id="password">

            <!-- Creates select option box with 3 options to choose-->
            <p>Role:</p>
            <select id="role">
                <option value="student">Student</option>
                <option value="parent">Parent</option>
                <option value="staff">School Staff</option>
            </select>
            <br><br>

            <!-- Sign in button that uses goPortal function and load Landing Screen-->
            <button class="btn" onclick="goPortal()">Login</button>
            <p id="err" style="color: red;"></p>
            <br>
            <a href="../Academia Landing/Academia_Landing.html">Back to Landing Page</a>
        </div>
    </div>

    <!--Creates list of pics-->
    <script>
        var pics = [
            "../../Images/AuthPage1.png",
            "../../Images/AuthPage2.png",
            "../../Images/AuthPage3.png",
            "../../Images/AuthPage4.png"
        ];
        // Variable to interpret the id of the image shown right now
        var i = 0;

        // Changes picture to the next one on the list
        function changePic() {
            i = i + 1;
            if (i == 4) {
                i = 0;
            }
            document.getElementById("slide-pic").src = pics[i];
        }

        // Calss fucnction changePic every 5 sec
        setInterval(changePic, 5000);

        
        // Creates function that saves data user put during sign in operation.
        function goPortal() {
            var u = document.getElementById("username").value;
            var p = document.getElementById("password").value;
            var r = document.getElementById("role").value;

            // Checkes if inputs provided by User are empty and tells user to Enter username and password.
            if (u == "" || p == "") {
                document.getElementById("err").innerHTML = "Enter username and password.";
                return;
            }


            
            // Depending on the role provided by the user load next screen Student/Parent/School Staff.
            if (r == "student") {
                window.location.href = "../Academia Student/Academia_Student.html";
            } else if (r == "parent") {
                window.location.href = "../Academia Parents/Academia_Parents.html";
            } else if (r == "staff") {
                window.location.href = "../Academia School Staff/Academia_School_Staff.html";
            }
    
            }
            


    </script>

</body>
</html>
