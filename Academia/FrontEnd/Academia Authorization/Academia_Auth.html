<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Creates the page title and connects the shared stylesheet. -->
    <meta charset="UTF-8">
    <title>Academia - Login</title>
    <link rel="stylesheet" href="../Academia.css">
</head>

<body>

    <!-- Creates the left side of the authentication page. -->
    <!-- This section displays the title and image slideshow. -->
    <div class="left-side">

        <h1>Academia</h1>

        <h2>
            One System.<br>
            A Stronger School Community.
        </h2>

        <p style="color: #60A5FA;">
            Students. Parents. Staff. All Connected.
        </p>

        <!-- Displays the current slideshow image. -->
        <img
            id="slide-pic"
            src="../../Images/AuthPage1.png"
            width="360"
            alt="Academia Slide"
        >

    </div>


    <!-- Creates the login menu on the right side. -->
    <!-- The user enters account information and selects a role. -->
    <div class="right-side">

        <div class="box" style="width: 300px;">

            <h2>Sign In</h2>

            <!-- Creates the username input. -->
            <p>Username:</p>
            <input type="text" id="username">

            <!-- Creates the password input. -->
            <p>Password:</p>
            <input type="password" id="password">

            <!-- Allows the user to select an account role. -->
            <p>Role:</p>

            <select id="role">
                <option value="student">Student</option>
                <option value="parent">Parent</option>
                <option value="staff">Staff</option>
            </select>

            <br><br>

            <!-- Sends the login information to the C server. -->
            <button
                class="btn"
                id="loginButton"
                type="button"
                onclick="goPortal()"
            >
                Login
            </button>

            <!-- Displays login and connection errors. -->
            <p id="err" style="color: red;"></p>

            <br>

            <a href="../Academia Landing/Academia_Landing.html">
                Back to Landing Page
            </a>

        </div>

    </div>


    <script>
        // Stores the images used by the authentication slideshow.
        var pics = [
            "../../Images/AuthPage1.png",
            "../../Images/AuthPage2.png",
            "../../Images/AuthPage3.png",
            "../../Images/AuthPage4.png"
        ];

        var i = 0;

        // Changes the slideshow to the next image.
        function changePic()
        {
            i = i + 1;

            if (i == pics.length)
            {
                i = 0;
            }

            document.getElementById("slide-pic").src = pics[i];
        }

        // Changes the slideshow image every five seconds.
        setInterval(changePic, 5000);


        // Sends the username, password, and role to the C server.
        // The server response determines which portal should open.
        async function goPortal()
        {
            var username =
                document.getElementById("username").value.trim();

            var password =
                document.getElementById("password").value;

            var role =
                document.getElementById("role").value;

            var errorMessage =
                document.getElementById("err");

            var loginButton =
                document.getElementById("loginButton");

            // Removes the previous error message.
            errorMessage.textContent = "";


            // Stops when required login information is missing.
            if (username == "" || password == "")
            {
                errorMessage.textContent =
                    "Enter username and password.";

                return;
            }


            // Prevents repeated requests while login is processing.
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            try
            {
                // Sends the login values to the C server on port 3000.
                var response = await fetch(
                    "http://localhost:3000/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password,
                            role: role
                        })
                    }
                );

                // Reads the role or error returned by the server.
                var result = await response.text();
                result = result.trim();


                // Rejects an invalid username, password, or role.
                if (!response.ok || result == "invalid")
                {
                    errorMessage.textContent =
                        "Invalid username, password, or role.";

                    return;
                }


                // Opens the portal matching the verified role.
                if (result == "student")
                {
                    window.location.href =
                        "../Academia Student/Academia_Student.html";
                }
                else if (result == "parent")
                {
                    window.location.href =
                        "../Academia Parents/Academia_Parents.html";
                }
                else if (result == "staff")
                {
                    window.location.href =
                        "../Academia Staff/Academia_Staff.html";
                }
                else
                {
                    errorMessage.textContent =
                        "The server returned an unknown role.";
                }
            }
            catch (error)
            {
                // Displays an error when server.exe is not running.
                errorMessage.textContent =
                    "Cannot connect to the Academia server.";

                console.log(error);
            }
            finally
            {
                // Allows the user to try logging in again.
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        }


        // Allows the Enter key to run the login function.
        document.addEventListener(
            "keydown",
            function(event)
            {
                if (event.key == "Enter")
                {
                    goPortal();
                }
            }
        );
    </script>

</body>

</html>
