
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Academia - Parent Portal</title>
    <link rel="stylesheet" href="../Academia.css">
</head>

<body>
    <script scr="FrontEnd\Records.js"></script>
    <script scr="FrontEnd\Academia.js"></script>
    <script scr="Parent.js"></script>
    
    <div class="navbar">
        <b>Academia Parent Portal</b>
        <a href="../Academia Authorization/Academia_Auth.html">
            Log Out
        </a>
    </div>

    <p id="error" style="color: red; text-align: center;"></p>

    <div class="blue-box">
        <h2 id="welcome">Welcome</h2>

        <p>
            Username:
            <span id="parentUsername"></span>
        </p>

        <p>
            Phone:
            <span id="parentPhone"></span>
        </p>
    </div>

    <div class="box">
        <h2>Student Information</h2>

        <p>Name: <span id="studentName"></span></p>
        <p>Grade Level: <span id="gradeLevel"></span></p>
        <p>GPA: <span id="studentGpa"></span></p>
    </div>

    <div class="box">
        <h2>Grades</h2>

        <table>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Score</th>
                </tr>
            </thead>

            <tbody id="gradeList"></tbody>
        </table>
    </div>

    <div class="box">
        <h2>Attendance</h2>

        <table>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="attendanceList"></tbody>
        </table>
    </div>

    <div class="box">
        <h2>Announcements</h2>
        <div id="announcementList"></div>
    </div>

    <div class="footer">
        Academia Parent Portal
    </div>

    <script src="Records.js"></script>
    <script src="Parent.js"></script>

</body>
</html>
