<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Academia - Parent Portal</title>
    <link rel="stylesheet" href="../Academia.css">
</head>

<body>

    <div class="navbar">
        <b>Academia Parent Portal</b>
        <a href="../Academia Authorization/Academia_Auth.html">
            Log Out
        </a>
    </div>

    <p id="error" style="color: red; text-align: center;"></p>

    <div class="blue-box">
        <h2 id="welcome">Welcome</h2>
        <p>Username: <span id="parentUsername"></span></p>
        <p>Phone: <span id="parentPhone"></span></p>
    </div>

    <div class="box">
        <h2>Student Information</h2>
        <p>Name: <span id="studentName"></span></p>
        <p>Grade Level: <span id="gradeLevel"></span></p>
        <p>GPA: <span id="studentGpa"></span></p>
    </div>

    <div class="box">
        <h2>Grades</h2>

        <table>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Score</th>
                </tr>
            </thead>

            <tbody id="gradeList"></tbody>
        </table>
    </div>

    <div class="box">
        <h2>Attendance</h2>

        <table>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="attendanceList"></tbody>
        </table>
    </div>

    <div class="box">
        <h2>Announcements</h2>
        <div id="announcementList"></div>
    </div>

    <div class="footer">
        Academia School System
    </div>

    <script src="../../BackEnd/Academia Parents/parents_states.js"></script>

    <script>
        window.onload = function()
        {
            if (typeof parentState == "undefined")
            {
                document.getElementById("error").textContent =
                    "Parent data could not be loaded.";

                return;
            }

            if (parentState.success == false)
            {
                document.getElementById("error").textContent =
                    parentState.error;

                return;
            }

            document.getElementById("welcome").textContent =
                "Welcome, " +
                parentState.parent.firstName +
                " " +
                parentState.parent.lastName;

            document.getElementById("parentUsername").textContent =
                parentState.parent.username;

            document.getElementById("parentPhone").textContent =
                parentState.parent.phone;

            if (parentState.students.length > 0)
            {
                var student = parentState.students[0];

                document.getElementById("studentName").textContent =
                    student.firstName + " " + student.lastName;

                document.getElementById("gradeLevel").textContent =
                    student.gradeLevel;

                document.getElementById("studentGpa").textContent =
                    student.gpa;

                showGrades(student.studentId);
                showAttendance(student.studentId);
            }
            else
            {
                document.getElementById("studentName").textContent =
                    "No connected student";

                document.getElementById("gradeLevel").textContent =
                    "Not available";

                document.getElementById("studentGpa").textContent =
                    "Not available";

                showEmptyRow("gradeList", "No grades available.");
                showEmptyRow(
                    "attendanceList",
                    "No attendance available."
                );
            }

            showAnnouncements();
        };


        function showGrades(studentId)
        {
            var gradeList =
                document.getElementById("gradeList");

            gradeList.innerHTML = "";

            for (var i = 0; i < parentState.grades.length; i++)
            {
                var grade = parentState.grades[i];

                if (grade.studentId == studentId)
                {
                    var row = gradeList.insertRow();

                    row.insertCell().textContent = grade.course;
                    row.insertCell().textContent = grade.score;
                }
            }

            if (gradeList.rows.length == 0)
            {
                showEmptyRow("gradeList", "No grades available.");
            }
        }


        function showAttendance(studentId)
        {
            var attendanceList =
                document.getElementById("attendanceList");

            attendanceList.innerHTML = "";

            for (
                var i = 0;
                i < parentState.attendance.length;
                i++
            )
            {
                var record = parentState.attendance[i];

                if (record.studentId == studentId)
                {
                    var row = attendanceList.insertRow();

                    row.insertCell().textContent = record.course;
                    row.insertCell().textContent = record.status;
                }
            }

            if (attendanceList.rows.length == 0)
            {
                showEmptyRow(
                    "attendanceList",
                    "No attendance available."
                );
            }
        }


        function showAnnouncements()
        {
            var list =
                document.getElementById("announcementList");

            list.innerHTML = "";

            for (
                var i = 0;
                i < parentState.announcements.length;
                i++
            )
            {
                var announcement =
                    parentState.announcements[i];

                var title = document.createElement("h3");
                var date = document.createElement("p");
                var message = document.createElement("p");
                var line = document.createElement("hr");

                title.textContent = announcement.title;
                date.textContent = announcement.date;
                message.textContent = announcement.message;

                list.appendChild(title);
                list.appendChild(date);
                list.appendChild(message);
                list.appendChild(line);
            }

            if (parentState.announcements.length == 0)
            {
                list.textContent =
                    "No announcements available.";
            }
        }


        function showEmptyRow(tableId, message)
        {
            var tableBody =
                document.getElementById(tableId);

            tableBody.innerHTML = "";

            var row = tableBody.insertRow();
            var cell = row.insertCell();

            cell.colSpan = 2;
            cell.textContent = message;
        }
    </script>

</body>

</html>
